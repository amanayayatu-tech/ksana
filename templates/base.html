<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agent Trading System{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.2/dist/purify.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080806;
      --bg-2: #11110d;
      --paper: #e7ddc4;
      --panel: rgba(19, 20, 16, 0.96);
      --panel-2: rgba(29, 31, 25, 0.98);
      --panel-3: #151711;
      --line: #39382f;
      --line-soft: rgba(231, 221, 196, 0.12);
      --text: #f3ead7;
      --muted: #b5aa92;
      --faint: #756f61;
      --accent: #42d7a4;
      --accent-2: #d7bd72;
      --amber: #d6a73b;
      --danger: #ef665d;
      --ok: #50d08f;
      --ink: #090907;
      --shadow: rgba(0, 0, 0, 0.42);
      --radius: 8px;
      --mono: "SFMono-Regular", "Cascadia Code", "Menlo", "Consolas", monospace;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(47, 43, 31, 0.82), transparent 360px),
        linear-gradient(90deg, rgba(215, 189, 114, 0.06) 1px, transparent 1px),
        linear-gradient(180deg, rgba(66, 215, 164, 0.045) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 48px 48px, 48px 48px, auto;
      color: var(--text);
      min-width: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: 0 clamp(18px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(18, 18, 14, 0.97), rgba(8, 8, 6, 0.93)),
        rgba(8, 8, 6, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
    }

    .topbar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(77, 217, 196, 0.64), rgba(226, 185, 79, 0.42), transparent);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 760;
      letter-spacing: 0;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand::before {
      content: "";
      width: 9px;
      height: 22px;
      border: 1px solid rgba(77, 217, 196, 0.7);
      border-top-color: var(--amber);
      background: linear-gradient(180deg, rgba(77, 217, 196, 0.18), rgba(226, 185, 79, 0.08));
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 10px 0;
    }

    .nav a {
      color: var(--muted);
      padding: 9px 13px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .nav a.active,
    .nav a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(20, 30, 42, 0.92);
      transform: translateY(-1px);
    }

    .shell {
      width: min(1220px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.sidebar { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); align-items: start; }

    .status-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .ops-board {
      display: grid;
      gap: 18px;
    }

    .command-banner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 0.82fr);
      gap: 18px;
      align-items: stretch;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(120deg, rgba(231, 221, 196, 0.08), transparent 54%),
        linear-gradient(180deg, rgba(66, 215, 164, 0.055), transparent),
        rgba(13, 14, 11, 0.96);
      box-shadow: 0 18px 42px var(--shadow);
    }

    .command-title {
      margin: 0;
      color: var(--paper);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 760;
      letter-spacing: 0;
      line-height: 1.02;
    }

    .command-subtitle {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(8, 8, 6, 0.7);
    }

    .metric-cell {
      min-width: 0;
      padding: 14px 15px;
      border-right: 1px solid var(--line);
    }

    .metric-cell:last-child {
      border-right: 0;
    }

    .metric-label {
      color: var(--faint);
      font-size: 12px;
      font-weight: 720;
    }

    .metric-value {
      margin-top: 4px;
      color: var(--text);
      font: 760 24px/1.08 var(--mono);
      overflow-wrap: anywhere;
    }

    .metric-caption {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .company-rail {
      display: grid;
      gap: 8px;
      align-content: stretch;
    }

    .stage-row {
      display: grid;
      grid-template-columns: minmax(150px, 0.9fr) minmax(110px, 0.68fr) minmax(90px, 0.52fr);
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent-2);
      background: rgba(9, 10, 8, 0.62);
    }

    .stage-name {
      color: var(--paper);
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .stage-metric,
    .stage-state {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .stage-state {
      color: var(--accent);
      text-align: right;
    }

    .guide-hero {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
      gap: 18px;
      align-items: stretch;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(120deg, rgba(66, 215, 164, 0.08), transparent 52%),
        rgba(13, 14, 11, 0.96);
      box-shadow: 0 18px 42px var(--shadow);
    }

    .guide-title {
      margin: 0;
      color: var(--paper);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .guide-subtitle {
      max-width: 700px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.72;
    }

    .guide-visual {
      position: relative;
      min-height: 300px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(66, 215, 164, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(215, 189, 114, 0.08) 1px, transparent 1px),
        rgba(5, 9, 12, 0.74);
      background-size: 34px 34px;
    }

    .guide-orbit {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(215, 189, 114, 0.26);
      border-radius: 50%;
    }

    .guide-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 148px;
      min-height: 82px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      padding: 12px;
      border: 1px solid rgba(66, 215, 164, 0.54);
      border-radius: var(--radius);
      color: var(--paper);
      font-weight: 760;
      text-align: center;
      background: rgba(8, 18, 18, 0.92);
    }

    .guide-node {
      position: absolute;
      min-width: 120px;
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent-2);
      background: rgba(10, 12, 9, 0.9);
      color: var(--text);
      font-size: 13px;
      font-weight: 720;
    }

    .guide-node small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-weight: 520;
      line-height: 1.35;
    }

    .node-research { left: 26px; top: 34px; }
    .node-perplexity { right: 28px; top: 44px; }
    .node-partners { right: 24px; bottom: 46px; }
    .node-red { left: 32px; bottom: 40px; }

    .guide-flow {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .flow-step {
      min-height: 118px;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-top: 3px solid var(--accent);
      background: rgba(10, 12, 9, 0.74);
    }

    .flow-step strong {
      display: block;
      color: var(--paper);
      line-height: 1.32;
    }

    .flow-step span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .guide-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .guide-checklist,
    .guide-map {
      display: grid;
      gap: 8px;
    }

    .guide-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .guide-item > div {
      min-width: 0;
    }

    .guide-item:last-child {
      border-bottom: 0;
    }

    .guide-index {
      display: grid;
      place-items: center;
      justify-self: center;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(66, 215, 164, 0.42);
      border-radius: 50%;
      color: var(--accent);
      font: 760 12px/26px var(--mono);
      letter-spacing: 0;
    }

    .guide-item strong {
      display: block;
      color: var(--text);
      line-height: 1.35;
    }

    .guide-item > div > span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.52;
    }

    .ops-layout {
      display: grid;
      grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1.22fr);
      gap: 18px;
      align-items: start;
    }

    .execution-panel {
      display: grid;
      gap: 14px;
    }

    .run-selector {
      display: grid;
      grid-template-columns: minmax(150px, 1fr);
      gap: 12px;
    }

    .run-progress {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(66, 215, 164, 0.08), transparent 90px),
        rgba(7, 12, 18, 0.78);
    }

    .run-progress-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .run-progress-title {
      color: var(--paper);
      font-weight: 760;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .run-progress-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(66, 215, 164, 0.22);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 260ms ease;
    }

    .step-list {
      display: grid;
      gap: 8px;
    }

    .step-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 50px;
      padding: 9px 10px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--line);
      background: rgba(8, 8, 6, 0.54);
    }

    .step-item.completed { border-left-color: var(--ok); }
    .step-item.running { border-left-color: var(--amber); background: rgba(42, 34, 15, 0.34); }
    .step-item.failed,
    .step-item.cancelled { border-left-color: var(--danger); }

    .step-index {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      font: 700 12px/1 var(--mono);
      background: rgba(4, 8, 12, 0.8);
    }

    .step-name {
      color: var(--text);
      font-weight: 720;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .step-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .step-state {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .step-item.completed .step-state { color: var(--ok); }
    .step-item.running .step-state { color: var(--amber); }
    .step-item.failed .step-state,
    .step-item.cancelled .step-state { color: var(--danger); }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .report-column {
      min-width: 0;
    }

    .memory-ledger {
      display: grid;
      gap: 10px;
    }

    .memory-row {
      display: grid;
      grid-template-columns: minmax(72px, 0.28fr) minmax(0, 1fr) minmax(90px, 0.28fr);
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .memory-row:last-child {
      border-bottom: 0;
    }

    .memory-title {
      color: var(--text);
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .memory-meta {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .research-workbench {
      display: grid;
      grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.1fr);
      gap: 18px;
      align-items: start;
    }

    .research-copy {
      display: grid;
      gap: 10px;
    }

    .textarea-duo {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .knowledge-receipt {
      display: grid;
      gap: 9px;
      min-height: 124px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 8, 6, 0.74);
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 13px;
    }

    .receipt-line:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .receipt-line strong {
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .ops-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .surface-split {
      display: grid;
      grid-template-columns: minmax(300px, 0.86fr) minmax(0, 1.14fr);
      gap: 16px;
      align-items: stretch;
    }

    .compact-stack {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .toolbar-main,
    .toolbar-actions {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .data-shell {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.46);
    }

    .data-shell table {
      border: 0;
      border-radius: 0;
      min-width: max(920px, 100%);
      table-layout: auto;
    }

    .data-shell th,
    .data-shell td {
      white-space: nowrap;
      overflow-wrap: normal;
    }

    .data-shell code {
      white-space: nowrap;
    }

    .data-shell .wrap {
      min-width: 360px;
      max-width: 620px;
      white-space: normal;
      overflow-wrap: break-word;
    }

    .data-shell .link-button {
      min-width: 220px;
      height: auto;
      min-height: 34px;
      padding-top: 5px;
      padding-bottom: 5px;
      line-height: 1.25;
      white-space: normal;
    }

    .data-shell table.history-table {
      min-width: max(1060px, 100%);
    }

    .data-shell table.history-table th:nth-child(1),
    .data-shell table.history-table td:nth-child(1) {
      min-width: 150px;
    }

    .data-shell table.history-table th:nth-child(6),
    .data-shell table.history-table td:nth-child(6) {
      min-width: 230px;
    }

    .data-shell table.prompt-table {
      min-width: max(720px, 100%);
    }

    .data-shell table.stock-table {
      min-width: max(760px, 100%);
    }

    .split-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 32px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 34px),
        var(--panel);
      box-shadow: 0 18px 42px var(--shadow);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), rgba(226, 185, 79, 0.72), transparent 72%);
      opacity: 0.72;
      pointer-events: none;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 15px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 16, 23, 0.36);
    }

    .panel-title {
      margin: 0;
      color: #f6fbff;
      font-size: 16px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 20px 22px 22px;
      overflow-x: auto;
    }

    .stock-section {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .stock-section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .stock-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(260px, auto);
      gap: 14px;
      align-items: end;
    }

    .agent-control-grid {
      display: grid;
      grid-template-columns: minmax(160px, 1.1fr) minmax(120px, 0.75fr) minmax(150px, 0.85fr) minmax(130px, 0.7fr) auto auto;
      gap: 14px;
      align-items: end;
    }

    .agent-control-grid label,
    .control-grid label {
      min-width: 0;
    }

    .agent-control-grid select,
    .agent-control-grid input,
    .control-grid select,
    .control-grid input {
      width: 100%;
    }

    .help-text {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      min-width: 0;
    }

    input,
    select,
    textarea {
      height: 40px;
      min-width: 0;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(7, 12, 18, 0.92);
      color: var(--text);
      padding: 0 11px;
      outline: none;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    textarea {
      height: 84px;
      resize: vertical;
      padding: 10px;
      line-height: 1.5;
    }

    .textarea-large {
      min-height: 280px;
      width: 100%;
      font: 13px/1.55 var(--mono);
    }

    .drop-zone {
      min-width: 0;
      padding: 10px;
      border: 1px dashed rgba(77, 217, 196, 0.32);
      border-radius: var(--radius);
      background: rgba(7, 12, 18, 0.34);
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .drop-zone textarea {
      min-height: 246px;
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(66, 215, 164, 0.12);
      box-shadow: 0 0 0 3px rgba(66, 215, 164, 0.12);
    }

    .drop-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-2);
      background: rgba(10, 18, 27, 0.98);
      box-shadow: 0 0 0 3px rgba(143, 183, 255, 0.14);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px;
      color: var(--text);
      background: var(--panel-2);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    button:hover {
      border-color: var(--accent-2);
      background: #1a2a39;
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .link-button {
      min-width: 190px;
      height: 32px;
      padding: 0 10px;
      color: #e4f4ff;
      background: rgba(18, 42, 60, 0.9);
      font-size: 12px;
      justify-content: center;
    }

    .primary {
      border-color: rgba(77, 217, 196, 0.58);
      background:
        linear-gradient(180deg, rgba(47, 139, 125, 0.82), rgba(21, 79, 75, 0.95)),
        #123d3a;
      color: #effffb;
      font-weight: 760;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .big-action {
      width: 100%;
      height: 66px;
      font-size: 17px;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .big-action::after {
      content: "";
      position: absolute;
      inset: auto 18px 10px 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237, 244, 248, 0.55), transparent);
      opacity: 0.35;
    }

    .danger {
      border-color: rgba(255, 111, 135, 0.56);
      background: rgba(64, 18, 30, 0.94);
      color: #ffdce2;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      max-width: 100%;
      padding: 4px 10px 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(8, 14, 20, 0.88);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--faint);
      flex: 0 0 auto;
    }

    .pill.ok { color: var(--ok); border-color: rgba(57, 216, 159, 0.45); }
    .pill.ok::before { background: var(--ok); }
    .pill.warn { color: var(--amber); border-color: rgba(226, 185, 79, 0.45); }
    .pill.warn::before { background: var(--amber); }
    .pill.error { color: var(--danger); border-color: rgba(255, 111, 135, 0.45); }
    .pill.error::before { background: var(--danger); }

    .terminal {
      height: 320px;
      overflow: auto;
      margin: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(77, 217, 196, 0.045), transparent 68px),
        #04080c;
      color: #c6ffe9;
      font: 13px/1.56 var(--mono);
      white-space: pre-wrap;
      box-shadow: inset 0 0 0 1px rgba(77, 217, 196, 0.04);
    }

    .terminal:empty::before {
      content: "等待运行输出";
      color: var(--faint);
    }

    .markdown {
      min-height: 360px;
      max-height: 700px;
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.88);
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      color: #f8fafc;
      letter-spacing: 0;
    }

    .markdown a {
      color: var(--accent-2);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .markdown code {
      background: #050a0f;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 5px;
      font-family: var(--mono);
    }

    .markdown pre {
      overflow: auto;
      padding: 12px;
      border-radius: var(--radius);
      background: #050a0f;
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(7, 13, 19, 0.68);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      background: rgba(9, 16, 24, 0.96);
      font-weight: 760;
      font-size: 13px;
    }

    tbody tr {
      transition: background 140ms ease;
    }

    tbody tr:hover td { background: rgba(143, 183, 255, 0.055); }
    tr:last-child td { border-bottom: 0; }
    tr.active-row td { background: rgba(77, 217, 196, 0.09); }
    td input { width: 100%; }

    .tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: rgba(7, 13, 19, 0.9);
    }

    .tab:last-child { border-right: 0; }
    .tab.active { background: #173447; color: #e3f7ff; }

    .muted { color: var(--muted); }
    .spacer { flex: 1; }
    .mt { margin-top: 18px; }
    .hidden { display: none !important; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px;
      background: rgba(3, 7, 12, 0.72);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: min(980px, 100%);
      max-height: 86vh;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 15px;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .modal-body {
      overflow: auto;
      padding: 16px;
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px;
      }

      .nav {
        width: 100%;
      }

      .shell {
        width: min(100% - 24px, 720px);
        padding: 18px 0 34px;
      }

      .grid.two,
      .grid.sidebar,
      .surface-split,
      .command-banner,
      .ops-layout,
      .report-grid,
      .research-workbench,
      .textarea-duo,
      .control-grid,
      .agent-control-grid,
      .guide-hero,
      .guide-split,
      .guide-flow {
        grid-template-columns: 1fr;
      }

      .metric-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric-cell:nth-child(2n) {
        border-right: 0;
      }

      .metric-cell:nth-child(n + 3) {
        border-top: 1px solid var(--line);
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-body {
        padding: 16px;
      }

      .big-action {
        height: 56px;
      }

      .stage-row,
      .memory-row,
      .step-item {
        grid-template-columns: 1fr;
      }

      .stage-state {
        text-align: left;
      }

      .guide-visual {
        min-height: 420px;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Nepha AI IC</a>
    <nav class="nav">
      <a class="{% if active_page == 'index' %}active{% endif %}" href="/">投委会</a>
      <a class="{% if active_page == 'deep_research' %}active{% endif %}" href="/deep-research">研究中枢</a>
      <a class="{% if active_page == 'history' %}active{% endif %}" href="/history">运行档案</a>
      <a class="{% if active_page == 'stock_pool' %}active{% endif %}" href="/stock-pool">股票池</a>
      <a class="{% if active_page == 'learning' %}active{% endif %}" href="/learning">学习复盘</a>
      <a class="{% if active_page == 'guide' %}active{% endif %}" href="/guide">使用指南</a>
      <a class="{% if active_page == 'env' %}active{% endif %}" href="/env">环境</a>
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
