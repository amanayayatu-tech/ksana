<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ResearchOS{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.2/dist/purify.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --bg-2: #0b0f12;
      --paper: #e8edf2;
      --panel: rgba(13, 17, 20, 0.96);
      --panel-2: rgba(18, 24, 28, 0.98);
      --panel-3: #10161a;
      --line: #26323b;
      --line-soft: rgba(232, 237, 242, 0.12);
      --text: #e9eff3;
      --muted: #98a6af;
      --faint: #66737d;
      --accent: #25d6b5;
      --accent-2: #d1b56a;
      --amber: #c99b3f;
      --warn: var(--amber);
      --danger: #f06f61;
      --ok: #36d399;
      --ink: #05070a;
      --shadow: rgba(0, 0, 0, 0.42);
      --radius: 8px;
      --mono: "SFMono-Regular", "Cascadia Code", "Menlo", "Consolas", monospace;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 16% 0%, rgba(66, 215, 164, 0.11), transparent 280px),
        linear-gradient(90deg, rgba(215, 189, 114, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, rgba(66, 215, 164, 0.035) 1px, transparent 1px),
        #070806;
      background-size: auto, 56px 56px, 56px 56px, auto;
      color: var(--text);
      min-width: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    .app-frame {
      display: grid;
      grid-template-columns: 244px minmax(0, 1fr);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 18px;
      min-height: 100vh;
      max-height: 100vh;
      padding: 22px 16px;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(18, 18, 14, 0.98), rgba(8, 8, 6, 0.94)),
        rgba(8, 8, 6, 0.94);
      backdrop-filter: blur(16px);
      box-shadow: 18px 0 44px rgba(0, 0, 0, 0.2);
      overflow-y: auto;
    }

    .topbar::after {
      content: "";
      position: absolute;
      top: 0;
      right: -1px;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, rgba(77, 217, 196, 0.58), rgba(226, 185, 79, 0.42), transparent);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 760;
      letter-spacing: 0;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
      min-height: 42px;
    }

    .brand::before {
      content: "";
      width: 9px;
      height: 22px;
      border: 1px solid rgba(77, 217, 196, 0.7);
      border-top-color: var(--amber);
      background: linear-gradient(180deg, rgba(77, 217, 196, 0.18), rgba(226, 185, 79, 0.08));
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      padding: 4px 0;
    }

    .nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      min-height: 38px;
      padding: 9px 11px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .nav a::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
    }

    .nav a.active,
    .nav a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(20, 30, 42, 0.82);
      transform: translateX(2px);
    }

    .nav a.active::after {
      background: var(--accent);
      box-shadow: 0 0 16px rgba(66, 215, 164, 0.72);
    }

    .sidebar-meta {
      display: grid;
      gap: 9px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
      color: var(--faint);
      font: 12px/1.45 var(--mono);
    }

    .sidebar-meta strong {
      color: var(--paper);
      font: 720 12px/1.2 var(--mono);
    }

    .sidebar-settings {
      display: grid;
      gap: 6px;
      padding: 11px 10px;
      border: 1px solid rgba(77, 217, 196, 0.22);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(13, 35, 38, 0.32);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .sidebar-settings:hover,
    .sidebar-settings.active {
      transform: translateY(-1px);
      border-color: rgba(77, 217, 196, 0.54);
      background: rgba(22, 57, 63, 0.48);
    }

    .sidebar-settings strong {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .sidebar-settings span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .main-area {
      min-width: 0;
    }

    .contextbar {
      position: sticky;
      top: 0;
      z-index: 9;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 clamp(18px, 3vw, 32px);
      border-bottom: 1px solid var(--line);
      background: rgba(7, 8, 6, 0.88);
      backdrop-filter: blur(18px);
    }

    .context-kicker {
      color: var(--faint);
      font: 720 11px/1 var(--mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .context-title {
      margin-top: 3px;
      color: var(--paper);
      font-weight: 760;
    }

    .context-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .shell {
      width: min(1440px, 100%);
      margin: 0;
      padding: 22px clamp(18px, 3vw, 32px) 48px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.sidebar { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); align-items: start; }

    .status-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .ops-board {
      display: grid;
      gap: 18px;
    }

    .command-banner {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(320px, 0.96fr);
      gap: 16px;
      align-items: stretch;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(66, 215, 164, 0.1) 0, transparent 42%),
        linear-gradient(180deg, rgba(231, 221, 196, 0.045), transparent 120px),
        rgba(13, 14, 11, 0.96);
      box-shadow: 0 14px 34px var(--shadow);
    }

    .command-title {
      margin: 0;
      color: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: clamp(24px, 2.8vw, 34px);
      font-weight: 760;
      letter-spacing: 0;
      line-height: 1.12;
    }

    .command-subtitle {
      max-width: 780px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.62;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(8, 8, 6, 0.7);
    }

    .metric-cell {
      min-width: 0;
      padding: 12px 13px;
      border-right: 1px solid var(--line);
    }

    .metric-cell:last-child {
      border-right: 0;
    }

    .metric-label {
      color: var(--faint);
      font-size: 12px;
      font-weight: 720;
    }

    .metric-value {
      margin-top: 4px;
      color: var(--text);
      font: 760 20px/1.08 var(--mono);
      overflow-wrap: anywhere;
    }

    .metric-caption {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .company-rail {
      display: grid;
      gap: 8px;
      align-content: stretch;
    }

    .stage-row {
      display: grid;
      grid-template-columns: minmax(150px, 0.9fr) minmax(110px, 0.68fr) minmax(90px, 0.52fr);
      gap: 10px;
      align-items: center;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent-2);
      background: rgba(9, 10, 8, 0.62);
    }

    .stage-name {
      color: var(--paper);
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .stage-metric,
    .stage-state {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .stage-state {
      color: var(--accent);
      text-align: right;
    }

    .guide-hero {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(320px, 1.05fr);
      gap: 18px;
      align-items: stretch;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(120deg, rgba(66, 215, 164, 0.08), transparent 52%),
        rgba(13, 14, 11, 0.96);
      box-shadow: 0 18px 42px var(--shadow);
    }

    .guide-copy {
      display: grid;
      align-content: start;
      gap: 12px;
      min-width: 0;
    }

    .guide-kicker {
      margin: 4px 0 -2px;
      color: var(--accent-2);
      font: 760 11px/1.3 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .guide-title {
      margin: 0;
      color: var(--paper);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .guide-subtitle {
      max-width: 700px;
      margin: 0;
      color: var(--muted);
      line-height: 1.72;
    }

    .guide-proof-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .guide-proof-strip div {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: rgba(6, 12, 16, 0.72);
    }

    .guide-proof-strip strong {
      display: block;
      color: var(--paper);
      font: 820 22px/1 var(--mono);
    }

    .guide-proof-strip span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .guide-visual {
      position: relative;
      min-height: 300px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(66, 215, 164, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(215, 189, 114, 0.08) 1px, transparent 1px),
        rgba(5, 9, 12, 0.74);
      background-size: 34px 34px;
    }

    .guide-orbit {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(215, 189, 114, 0.26);
      border-radius: 50%;
    }

    .guide-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 148px;
      min-height: 82px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      padding: 12px;
      border: 1px solid rgba(66, 215, 164, 0.54);
      border-radius: var(--radius);
      color: var(--paper);
      font-weight: 760;
      text-align: center;
      background: rgba(8, 18, 18, 0.92);
    }

    .guide-node {
      position: absolute;
      min-width: 120px;
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent-2);
      background: rgba(10, 12, 9, 0.9);
      color: var(--text);
      font-size: 13px;
      font-weight: 720;
    }

    .guide-node small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-weight: 520;
      line-height: 1.35;
    }

    .node-research { left: 26px; top: 34px; }
    .node-perplexity { right: 28px; top: 44px; }
    .node-partners { right: 24px; bottom: 46px; }
    .node-red { left: 32px; bottom: 40px; }

    .guide-flow {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }

    .flow-step {
      position: relative;
      grid-column: span 3;
      min-height: 132px;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-top: 3px solid var(--accent);
      background:
        linear-gradient(180deg, rgba(66, 215, 164, 0.055), transparent 72px),
        rgba(10, 12, 9, 0.74);
    }

    .guide-flow .flow-step:nth-child(n + 5) {
      grid-column: span 4;
      min-height: 116px;
    }

    .flow-step strong {
      display: block;
      color: var(--paper);
      line-height: 1.32;
    }

    .flow-step span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .guide-explain-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .explain-card,
    .cold-start-card,
    .standard-item {
      min-width: 0;
      border: 1px solid var(--line-soft);
      background:
        linear-gradient(180deg, rgba(66, 215, 164, 0.045), transparent 78px),
        rgba(7, 13, 19, 0.56);
    }

    .explain-card {
      display: grid;
      gap: 10px;
      align-content: start;
      min-height: 188px;
      padding: 14px;
      border-top: 3px solid var(--accent);
      border-radius: var(--radius);
    }

    .explain-card h3,
    .cold-start-copy h3 {
      margin: 0;
      color: var(--paper);
      line-height: 1.28;
    }

    .explain-card p,
    .cold-start-copy p,
    .cold-start-card span,
    .standard-item span {
      margin: 0;
      color: var(--muted);
      line-height: 1.58;
    }

    .cold-start-system {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 14px;
      align-items: stretch;
    }

    .cold-start-copy {
      display: grid;
      gap: 12px;
      align-content: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent-2);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(215, 189, 114, 0.09), transparent 58%),
        rgba(10, 12, 9, 0.74);
    }

    .cold-start-flow {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .cold-start-card {
      display: grid;
      gap: 8px;
      align-content: start;
      padding: 13px;
      border-radius: 8px;
    }

    .cold-start-card:nth-child(5) {
      grid-column: 1 / -1;
    }

    .cold-start-card strong,
    .standard-item strong {
      color: var(--paper);
      line-height: 1.35;
    }

    .investor-standard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .standard-item {
      display: grid;
      gap: 8px;
      align-content: start;
      min-height: 112px;
      padding: 14px;
      border-left: 3px solid rgba(66, 215, 164, 0.7);
      border-radius: 8px;
    }

    .guide-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .guide-checklist,
    .guide-map {
      display: grid;
      gap: 8px;
    }

    .guide-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .guide-item > div {
      min-width: 0;
    }

    .guide-item:last-child {
      border-bottom: 0;
    }

    .guide-index {
      display: grid;
      place-items: center;
      justify-self: center;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(66, 215, 164, 0.42);
      border-radius: 50%;
      color: var(--accent);
      font: 760 12px/26px var(--mono);
      letter-spacing: 0;
    }

    .guide-item strong {
      display: block;
      color: var(--text);
      line-height: 1.35;
    }

    .guide-item > div > span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.52;
    }

    .workflow-hero {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
      gap: 18px;
      align-items: stretch;
      min-height: min(74vh, 680px);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(120deg, rgba(66, 215, 164, 0.1), transparent 44%),
        linear-gradient(180deg, rgba(231, 221, 196, 0.045), transparent 160px),
        rgba(13, 14, 11, 0.96);
      box-shadow: 0 18px 42px var(--shadow);
    }

    .workflow-copy {
      display: grid;
      align-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .workflow-steps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: stretch;
    }

    .workflow-step {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 11px;
      align-items: start;
      min-height: 84px;
      padding: 13px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent-2);
      background: rgba(8, 12, 15, 0.68);
    }

    .workflow-step.primary-flow {
      border-left-color: var(--accent);
      background: rgba(18, 48, 48, 0.42);
    }

    .workflow-steps .workflow-step:last-child:nth-child(odd) {
      grid-column: 1 / -1;
      min-height: 78px;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(66, 215, 164, 0.11), transparent 64%),
        rgba(8, 12, 15, 0.68);
    }

    .workflow-number {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-top: 0;
      border: 1px solid rgba(66, 215, 164, 0.42);
      border-radius: 50%;
      color: var(--accent);
      font: 760 12px/1 var(--mono);
      text-align: center;
    }

    .workflow-step strong {
      display: block;
      color: var(--paper);
      line-height: 1.32;
    }

    .workflow-step > div > span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .hero-actions {
      display: grid;
      grid-template-columns: minmax(156px, 0.35fr) minmax(260px, 0.65fr);
      gap: 12px;
      align-items: end;
      max-width: 620px;
    }

    .workflow-actions {
      grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
      max-width: 820px;
    }

    .workflow-action-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }

    .workflow-action-row button {
      width: 100%;
      min-height: 52px;
      height: auto;
      padding: 10px 12px;
      white-space: normal;
      line-height: 1.28;
    }

    .workflow-gate-grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.86fr) minmax(360px, 1.14fr);
      gap: 16px;
      align-items: start;
    }

    #researchGate {
      scroll-margin-top: 76px;
    }

    .workflow-gate-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .workflow-gate-summary > div {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line-soft);
      background: rgba(8, 12, 15, 0.62);
    }

    .workflow-gate-summary span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .workflow-gate-summary strong {
      display: block;
      margin-top: 3px;
      color: var(--paper);
      font: 760 18px/1.1 var(--mono);
    }

    .workflow-prompt-list {
      display: grid;
      gap: 9px;
      max-height: 430px;
      overflow: auto;
      padding-right: 4px;
    }

    .workflow-prompt-card {
      display: grid;
      gap: 8px;
      width: 100%;
      height: auto;
      min-height: 84px;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent-2);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.58);
      color: var(--text);
      text-align: left;
      white-space: normal;

    .workflow-prompt-card:hover,

    .workflow-prompt-card.filled {

    .workflow-prompt-card.pending_cold_start {

      background: rgba(42, 34, 15, 0.34);
    }

    .workflow-prompt-card.skip_cold_start,

    .workflow-prompt-head {

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .workflow-prompt-id {

      font: 760 12px/1.25 var(--mono);
      overflow-wrap: anywhere;
    }

    .workflow-prompt-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .workflow-fill-card {
      display: grid;
      gap: 12px;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(66, 215, 164, 0.08), transparent 46%),
        rgba(7, 12, 18, 0.68);
    }

    .workflow-prompt-textarea {
      width: 100%;
      min-height: 138px;
      font: 12px/1.55 var(--mono);
    }

    .workflow-answer-box textarea {
      min-height: 170px;
      font: 13px/1.55 var(--mono);
    }

    .workflow-rerun-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(226, 185, 79, 0.34);
      border-radius: var(--radius);
      background: rgba(39, 30, 11, 0.38);
    }

    .workflow-rerun-strip strong,
    .workflow-fill-card strong {
      color: var(--paper);
    }

    .workflow-rerun-strip span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .report-link-card {
      display: grid;
      gap: 7px;
      min-height: 124px;
      padding: 16px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.72);
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .report-link-card:hover {
      border-color: var(--accent-2);
      background: rgba(18, 42, 60, 0.74);
      transform: translateY(-1px);
    }

    .report-link-card strong {
      color: var(--paper);
      font-size: 16px;
    }

    .report-link-card span,
    .report-link-card small {
      color: var(--muted);
      line-height: 1.5;
    }

    .sample-report-grid,
    .partner-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .sample-report-card,
    .partner-card {
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.62);
    }

    .sample-report-card h3,
    .partner-card h3,
    .sample-block h4 {
      margin: 0;
      color: var(--paper);
      line-height: 1.28;
    }

    .sample-block {
      display: grid;
      gap: 5px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
    }

    .sample-block p {
      margin: 0;
      color: var(--muted);
      line-height: 1.58;
    }

    .agent-tag {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      padding: 4px 8px;
      border: 1px solid rgba(66, 215, 164, 0.36);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(66, 215, 164, 0.08);
      font: 720 12px/1.3 var(--mono);
    }

    .rules-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.62;
    }

    .ops-layout {
      display: grid;
      grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1.22fr);
      gap: 18px;
      align-items: start;
    }

    .execution-panel {
      display: grid;
      gap: 14px;
    }

    .run-selector {
      display: grid;
      grid-template-columns: minmax(150px, 1fr);
      gap: 12px;
    }

    .run-progress {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(66, 215, 164, 0.08), transparent 90px),
        rgba(7, 12, 18, 0.78);
    }

    .run-detail-tabs {
      width: max-content;
      max-width: 100%;
      margin-bottom: 14px;
    }

    .run-detail-panel {
      display: grid;
      gap: 14px;
    }

    .run-progress-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .run-progress-title {
      color: var(--paper);
      font-weight: 760;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .run-progress-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(66, 215, 164, 0.22);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 260ms ease;
    }

    .step-list {
      display: grid;
      gap: 8px;
    }

    .step-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 50px;
      padding: 9px 10px;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--line);
      background: rgba(8, 8, 6, 0.54);
    }

    .step-item.completed { border-left-color: var(--ok); }
    .step-item.running { border-left-color: var(--amber); background: rgba(42, 34, 15, 0.34); }
    .step-item.failed,
    .step-item.cancelled { border-left-color: var(--danger); }

    .step-index {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      font: 700 12px/1 var(--mono);
      background: rgba(4, 8, 12, 0.8);
    }

    .step-name {
      color: var(--text);
      font-weight: 720;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .step-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .step-state {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .step-item.completed .step-state { color: var(--ok); }
    .step-item.running .step-state { color: var(--amber); }
    .step-item.failed .step-state,
    .step-item.cancelled .step-state { color: var(--danger); }

    .usage-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .usage-summary-grid div {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(66, 215, 164, 0.05), transparent 72px),
        rgba(7, 13, 19, 0.62);
    }

    .usage-summary-grid strong {
      display: block;
      color: var(--paper);
      font: 800 21px/1.1 var(--mono);
      overflow-wrap: anywhere;
    }

    .usage-summary-grid span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .usage-note {
      margin: 0;
      line-height: 1.6;
    }

    .usage-note a {
      color: var(--accent);
    }

    .usage-table-shell table {
      min-width: max(980px, 100%);
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .report-column {
      min-width: 0;
    }

    .report-frame-inline {
      width: 100%;
      height: min(78vh, 860px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #020708;
    }

    .memory-ledger {
      display: grid;
      gap: 10px;
    }

    .memory-row {
      display: grid;
      grid-template-columns: minmax(72px, 0.28fr) minmax(0, 1fr) minmax(90px, 0.28fr);
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .memory-row:last-child {
      border-bottom: 0;
    }

    .memory-title {
      color: var(--text);
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .memory-meta {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .research-workbench {
      display: grid;
      grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.1fr);
      gap: 18px;
      align-items: start;
    }

    .research-copy {
      display: grid;
      gap: 10px;
    }

    .textarea-duo {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .knowledge-receipt {
      display: grid;
      gap: 9px;
      min-height: 124px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 8, 6, 0.74);
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 13px;
    }

    .receipt-line:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .receipt-line strong {
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .ops-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .surface-split {
      display: grid;
      grid-template-columns: minmax(300px, 0.86fr) minmax(0, 1.14fr);
      gap: 16px;
      align-items: stretch;
    }

    .compact-stack {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .toolbar-main,
    .toolbar-actions {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .data-shell {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.46);
    }

    .data-shell table {
      border: 0;
      border-radius: 0;
      min-width: max(920px, 100%);
      table-layout: auto;
    }

    .data-shell th,
    .data-shell td {
      white-space: nowrap;
      overflow-wrap: normal;
    }

    .data-shell th {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .data-shell code {
      white-space: nowrap;
    }

    .data-shell .wrap {
      min-width: 360px;
      max-width: 620px;
      white-space: normal;
      overflow-wrap: break-word;
    }

    .data-shell .link-button {
      min-width: 220px;
      height: auto;
      min-height: 34px;
      padding-top: 5px;
      padding-bottom: 5px;
      line-height: 1.25;
      white-space: normal;
    }

    .data-shell table.history-table {
      min-width: max(1060px, 100%);
    }

    .data-shell table.history-table th:nth-child(1),
    .data-shell table.history-table td:nth-child(1) {
      min-width: 150px;
    }

    .data-shell table.history-table th:nth-child(6),
    .data-shell table.history-table td:nth-child(6) {
      min-width: 230px;
    }

    .data-shell table.prompt-table {
      min-width: max(720px, 100%);
    }

    .data-shell table.stock-table {
      min-width: max(760px, 100%);
    }

    .split-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 32px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.026), transparent 34px),
        var(--panel);
      box-shadow: 0 14px 34px var(--shadow);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), rgba(226, 185, 79, 0.72), transparent 72%);
      opacity: 0.72;
      pointer-events: none;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 18px 12px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 16, 23, 0.36);
    }

    .panel-title {
      margin: 0;
      color: #f6fbff;
      font-size: 16px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 18px 20px 20px;
      overflow-x: auto;
    }

    .stock-section {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .stock-section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .stock-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stock-section-count {
      color: var(--muted);
      font: 700 12px/1.2 var(--mono);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(260px, auto);
      gap: 14px;
      align-items: end;
    }

    .agent-control-grid {
      display: grid;
      grid-template-columns: minmax(160px, 1.1fr) minmax(120px, 0.75fr) minmax(150px, 0.85fr) minmax(130px, 0.7fr) auto auto;
      gap: 14px;
      align-items: end;
    }

    .agent-control-grid label,
    .control-grid label {
      min-width: 0;
    }

    .agent-control-grid select,
    .agent-control-grid input,
    .control-grid select,
    .control-grid input {
      width: 100%;
    }

    .help-text {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      min-width: 0;
    }

    input,
    select,
    textarea {
      height: 40px;
      min-width: 0;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(7, 12, 18, 0.92);
      color: var(--text);
      padding: 0 11px;
      outline: none;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    textarea {
      height: 84px;
      resize: vertical;
      padding: 10px;
      line-height: 1.5;
    }

    .textarea-large {
      min-height: 280px;
      width: 100%;
      font: 13px/1.55 var(--mono);
    }

    .drop-zone {
      min-width: 0;
      padding: 10px;
      border: 1px dashed rgba(77, 217, 196, 0.32);
      border-radius: var(--radius);
      background: rgba(7, 12, 18, 0.34);
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .drop-zone textarea {
      min-height: 246px;
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(66, 215, 164, 0.12);
      box-shadow: 0 0 0 3px rgba(66, 215, 164, 0.12);
    }

    .drop-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-2);
      background: rgba(10, 18, 27, 0.98);
      box-shadow: 0 0 0 3px rgba(143, 183, 255, 0.14);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px;
      color: var(--text);
      background: var(--panel-2);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    button:hover {
      border-color: var(--accent-2);
      background: #1a2a39;
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button:disabled:hover {
      border-color: var(--line);
      background: var(--panel-2);
      transform: none;
    }
    button.busy { cursor: wait; }

    .link-button {
      min-width: 190px;
      height: 32px;
      padding: 0 10px;
      color: #e4f4ff;
      background: rgba(18, 42, 60, 0.9);
      font-size: 12px;
      justify-content: center;
    }

    .primary {
      border-color: rgba(77, 217, 196, 0.58);
      background:
        linear-gradient(180deg, rgba(47, 139, 125, 0.82), rgba(21, 79, 75, 0.95)),
        #123d3a;
      color: #effffb;
      font-weight: 760;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .big-action {
      width: 100%;
      height: 58px;
      font-size: 16px;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .big-action::after {
      content: "";
      position: absolute;
      inset: auto 18px 10px 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(237, 244, 248, 0.55), transparent);
      opacity: 0.35;
    }

    .danger {
      border-color: rgba(255, 111, 135, 0.56);
      background: rgba(64, 18, 30, 0.94);
      color: #ffdce2;
    }

    button.danger:disabled:hover {
      border-color: rgba(255, 111, 135, 0.56);
      background: rgba(64, 18, 30, 0.94);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      max-width: 100%;
      padding: 4px 10px 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(8, 14, 20, 0.88);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--faint);
      flex: 0 0 auto;
    }

    .pill.ok { color: var(--ok); border-color: rgba(57, 216, 159, 0.45); }
    .pill.ok::before { background: var(--ok); }
    .pill.warn { color: var(--amber); border-color: rgba(226, 185, 79, 0.45); }
    .pill.warn::before { background: var(--amber); }
    .pill.error { color: var(--danger); border-color: rgba(255, 111, 135, 0.45); }
    .pill.error::before { background: var(--danger); }

    .terminal {
      height: 320px;
      overflow: auto;
      margin: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(77, 217, 196, 0.045), transparent 68px),
        #04080c;
      color: #c6ffe9;
      font: 13px/1.56 var(--mono);
      white-space: pre-wrap;
      box-shadow: inset 0 0 0 1px rgba(77, 217, 196, 0.04);
    }

    .terminal:empty::before {
      content: "等待运行输出";
      color: var(--faint);
    }

    .markdown {
      min-height: 360px;
      max-height: 700px;
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(7, 13, 19, 0.88);
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      color: #f8fafc;
      letter-spacing: 0;
    }

    .markdown a {
      color: var(--accent-2);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .markdown code {
      background: #050a0f;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 5px;
      font-family: var(--mono);
    }

    .markdown pre {
      overflow: auto;
      padding: 12px;
      border-radius: var(--radius);
      background: #050a0f;
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(7, 13, 19, 0.68);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px 11px;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      background: rgba(9, 16, 24, 0.96);
      font-weight: 760;
      font-size: 13px;
    }

    tbody tr {
      transition: background 140ms ease;
    }

    tbody tr:hover td { background: rgba(143, 183, 255, 0.055); }
    tr:last-child td { border-bottom: 0; }
    tr.active-row td { background: rgba(77, 217, 196, 0.09); }
    td input { width: 100%; }

    .tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: rgba(7, 13, 19, 0.9);
    }

    .tab:last-child { border-right: 0; }
    .tab.active { background: #173447; color: #e3f7ff; }

    .muted { color: var(--muted); }
    .spacer { flex: 1; }
    .mt { margin-top: 18px; }
    .hidden { display: none !important; }

    details.advanced-panel > summary.panel-head {
      cursor: pointer;
      list-style: none;
    }

    details.advanced-panel > summary.panel-head::-webkit-details-marker {
      display: none;
    }

    details.advanced-panel > summary.panel-head::after {
      content: "展开";
      color: var(--muted);
      font-size: 12px;
    }

    details.advanced-panel[open] > summary.panel-head::after {
      content: "收起";
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px;
      background: rgba(3, 7, 12, 0.72);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: min(980px, 100%);
      max-height: 86vh;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .modal.report-modal {
      width: min(1440px, 96vw);
      height: 90vh;
      max-height: 90vh;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 15px;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .modal-body {
      overflow: auto;
      padding: 16px;
    }

    .modal-body.frame-body {
      padding: 0;
      overflow: hidden;
    }

    .artifact-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 70vh;
      border: 0;
      background: #020708;
    }

    @media (max-width: 1260px) {
      .workflow-hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .workflow-copy {
        align-content: start;
      }

      .workflow-copy .command-subtitle {
        max-width: 760px;
      }

      .workflow-actions,
      .workflow-gate-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .app-frame {
        display: block;
      }

      .topbar {
        position: sticky;
        top: 0;
        min-height: auto;
        max-height: none;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
        overflow: visible;
      }

      .topbar::after {
        inset: auto 0 -1px 0;
        width: auto;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(77, 217, 196, 0.64), rgba(226, 185, 79, 0.42), transparent);
      }

      .nav {
        flex-direction: row;
        width: 100%;
        overflow-x: auto;
        padding: 8px 0 2px;
      }

      .nav a {
        min-height: 36px;
      }

      .nav a:hover,
      .nav a.active {
        transform: translateY(-1px);
      }

      .nav a::after,
      .sidebar-meta,
      .context-actions {
        display: none;
      }

      .contextbar {
        position: static;
        min-height: 52px;
        padding: 10px 16px;
      }

      .shell {
        width: min(calc(100% - 24px), 720px);
        margin: 0 auto;
        padding: 18px 0 34px;
      }

      .grid.two,
      .grid.sidebar,
      .surface-split,
      .command-banner,
      .ops-layout,
      .report-grid,
      .research-workbench,
      .textarea-duo,
      .control-grid,
      .agent-control-grid,
      .guide-hero,
      .guide-proof-strip,
      .guide-split,
      .guide-flow,
      .guide-explain-grid,
      .cold-start-system,
      .cold-start-flow,
      .investor-standard-grid,
      .workflow-hero,
      .workflow-steps,
      .hero-actions,
      .workflow-action-row,
      .workflow-gate-summary,
      .usage-summary-grid,
      .sample-report-grid,
      .partner-grid {
        grid-template-columns: 1fr;
      }

      .guide-flow .flow-step,
      .guide-flow .flow-step:nth-child(n + 5),
      .cold-start-card:nth-child(5),
      .workflow-steps .workflow-step:last-child:nth-child(odd) {
        grid-column: auto;
      }

      .workflow-rerun-strip {
        align-items: stretch;
        flex-direction: column;
      }

      .metric-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric-cell:nth-child(2n) {
        border-right: 0;
      }

      .metric-cell:nth-child(n + 3) {
        border-top: 1px solid var(--line);
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-body {
        padding: 16px;
      }

      .big-action {
        height: 56px;
      }

      .stage-row,
      .memory-row,
      .step-item {
        grid-template-columns: 1fr;
      }

      .stage-state {
        text-align: left;
      }

      .guide-visual {
        min-height: 420px;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <a class="brand" href="/">WorldPay IC</a>
      <nav class="nav">
        <a class="{% if active_page == 'index' %}active{% endif %}" href="/">任务流</a>
        <a class="{% if active_page == 'deep_research' %}active{% endif %}" href="/deep-research">Deep Research Inbox</a>
        <a class="{% if active_page == 'history' %}active{% endif %}" href="/history">报告中心</a>
        <a class="{% if active_page == 'stock_pool' %}active{% endif %}" href="/stock-pool">股票池</a>
        <a class="{% if active_page == 'learning' %}active{% endif %}" href="/learning">复盘库</a>
        <a class="{% if active_page == 'guide' %}active{% endif %}" href="/guide">使用说明</a>
      </nav>
      <div class="sidebar-meta">
        <a class="sidebar-settings {% if active_page == 'env' %}active{% endif %}" href="/env">
          <strong>LLM API 设置</strong>
          <span>Codex 登录 / OpenAI API</span>
          <span>LLM 调用监测</span>
        </a>
      </div>
    </header>
    <div class="main-area">
      <div class="contextbar">
        <div>
          <div class="context-kicker">RESEARCHOS</div>
          <div class="context-title">Alpha Committee 工作流</div>
        </div>
        <div class="context-actions">
          <span class="pill ok">Productized</span>
          <span class="pill">Report Center</span>
        </div>
      </div>
      <main class="shell">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script>
    window.ResearchOS = {
      parseSse(event) {
        try {
          return JSON.parse(event?.data || "{}");
        } catch (_error) {
          return { event: event?.type || "message", severity: "error", message: "SSE 数据格式错误" };
        }
      },
      promptStatusKind(status) {
        if (status === "filled") return "ok";
        if (["pending_cold_start", "skipped", "skip_cold_start"].includes(status)) return "warn";
        if (status === "failed") return "error";
        return "";
      },
      isPendingPromptStatus(status) {
        return ["pending", "pending_cold_start"].includes(status);
      },
      isSkippedPromptStatus(status) {
        return ["skipped", "skip_cold_start"].includes(status);
      },
      promptStatusRank(status) {
        return {
          pending_cold_start: 0,
          pending: 1,
          filled: 2,
          skip_cold_start: 3,
          skipped: 4,
        }[status] ?? 9;
      },
      setButtonBusy(button, busy, busyText = "处理中") {
        if (!button) return;
        if (busy) {
          if (!button.dataset.idleText) button.dataset.idleText = button.textContent;
          button.textContent = busyText;
          button.disabled = true;
          button.classList.add("busy");
          return;
        }
        button.textContent = button.dataset.idleText || button.textContent;
        button.disabled = false;
        button.classList.remove("busy");
      },
      async withBusy(button, busyText, action) {
        this.setButtonBusy(button, true, busyText);
        try {
          return await action();
        } finally {
          this.setButtonBusy(button, false);
        }
      },
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
