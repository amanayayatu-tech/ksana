<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agent Trading System{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.2/dist/purify.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121821;
      --panel-2: #161f2b;
      --line: #243142;
      --text: #e7edf5;
      --muted: #93a4b8;
      --accent: #5eead4;
      --accent-2: #60a5fa;
      --danger: #fb7185;
      --warn: #fbbf24;
      --ok: #34d399;
      --shadow: rgba(0, 0, 0, 0.28);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(25, 34, 47, 0.78), transparent 360px),
        var(--bg);
      color: var(--text);
      min-width: 1120px;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 15, 20, 0.92);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-weight: 720;
      letter-spacing: 0;
      color: var(--accent);
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav a {
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 7px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .nav a.active,
    .nav a:hover {
      color: var(--text);
      border-color: var(--line);
      background: var(--panel);
    }

    .shell {
      width: 1180px;
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.two { grid-template-columns: 1fr 1fr; }
    .grid.sidebar { grid-template-columns: 340px 1fr; align-items: start; }

    .status-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 24, 33, 0.96);
      box-shadow: 0 14px 34px var(--shadow);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0;
      font-size: 16px;
      font-weight: 720;
    }

    .panel-body { padding: 18px; }

    .stock-section {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .stock-section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .stock-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr)) auto;
      gap: 14px;
      align-items: end;
    }

    .agent-control-grid {
      display: grid;
      grid-template-columns: minmax(180px, 1.25fr) minmax(120px, 0.8fr) minmax(160px, 1fr) minmax(130px, 0.8fr) auto auto;
      gap: 14px;
      align-items: end;
    }

    .agent-control-grid label,
    .control-grid label {
      min-width: 0;
    }

    .agent-control-grid select,
    .agent-control-grid input,
    .control-grid select,
    .control-grid input {
      width: 100%;
    }

    .help-text {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select,
    textarea {
      height: 38px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #0d131b;
      color: var(--text);
      padding: 0 10px;
      outline: none;
      font: inherit;
    }

    textarea {
      height: 84px;
      resize: vertical;
      padding: 10px;
      line-height: 1.5;
    }

    .textarea-large {
      min-height: 280px;
      width: 100%;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.14);
    }

    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 14px;
      color: var(--text);
      background: var(--panel-2);
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent-2); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .link-button {
      height: 30px;
      padding: 0 10px;
      color: #dff6ff;
      background: #102235;
      font-size: 12px;
    }

    .primary {
      border-color: rgba(94, 234, 212, 0.45);
      background: linear-gradient(180deg, #11423f, #0f302f);
      color: #dffcf8;
      font-weight: 720;
    }

    .big-action {
      width: 100%;
      height: 62px;
      font-size: 18px;
      justify-content: center;
    }

    .danger {
      border-color: rgba(251, 113, 133, 0.55);
      background: #3a121b;
      color: #fecdd3;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #0d131b;
      font-size: 12px;
      white-space: nowrap;
    }

    .pill.ok { color: var(--ok); border-color: rgba(52, 211, 153, 0.45); }
    .pill.warn { color: var(--warn); border-color: rgba(251, 191, 36, 0.45); }
    .pill.error { color: var(--danger); border-color: rgba(251, 113, 133, 0.45); }

    .terminal {
      height: 320px;
      overflow: auto;
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #070a0f;
      color: #b7f7df;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    .markdown {
      min-height: 360px;
      max-height: 700px;
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d131b;
      line-height: 1.72;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 { color: #f8fafc; }

    .markdown code {
      background: #06090d;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 5px;
    }

    .markdown pre {
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #06090d;
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      background: #0d131b;
      font-weight: 650;
      font-size: 13px;
    }

    tr:last-child td { border-bottom: 0; }
    tr.active-row td { background: rgba(96, 165, 250, 0.1); }
    td input { width: 100%; }

    .tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: #0d131b;
    }

    .tab:last-child { border-right: 0; }
    .tab.active { background: #173344; color: #dff6ff; }

    .muted { color: var(--muted); }
    .spacer { flex: 1; }
    .mt { margin-top: 18px; }
    .hidden { display: none !important; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px;
      background: rgba(3, 7, 12, 0.72);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: min(980px, 100%);
      max-height: 86vh;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 15px;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .modal-body {
      overflow: auto;
      padding: 16px;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Agent Trading System</a>
    <nav class="nav">
	      <a class="{% if active_page == 'index' %}active{% endif %}" href="/">主页</a>
	      <a class="{% if active_page == 'history' %}active{% endif %}" href="/history">运行历史</a>
	      <a class="{% if active_page == 'stock_pool' %}active{% endif %}" href="/stock-pool">股池管理</a>
	      <a class="{% if active_page == 'deep_research' %}active{% endif %}" href="/deep-research">深度研究</a>
	      <a class="{% if active_page == 'env' %}active{% endif %}" href="/env">环境配置</a>
	    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
