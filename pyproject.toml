[project]
name = "agent-trading-system"
version = "0.1.0"
description = "Methodology-driven local agent trading system scaffold."
requires-python = ">=3.11"
dependencies = [
    "apscheduler",
    "click",
    "jinja2",
    "openai",
    "pydantic>=2",
    "python-dotenv",
    "PyYAML",
]

[project.scripts]
chairman = "chairman.cli:main"
red-team = "red_team.cli:main"
orchestrator = "orchestrator.cli:main"
research-agent = "business_agents.research_agent.cli:main"
trading-fengliu = "business_agents.trading_fengliu.cli:main"
trading-wanmu = "business_agents.trading_wanmu.cli:main"
trading-liguofei = "business_agents.trading_liguofei.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chairman", "red_team", "orchestrator", "business_agents"]

[tool.hatch.build.targets.wheel.force-include]
"business_agents/_common/prompts" = "business_agents/_common/prompts"
"business_agents/research_agent/prompts" = "business_agents/research_agent/prompts"
"chairman/output/templates" = "chairman/output/templates"
"red_team/output/templates" = "red_team/output/templates"

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
webui = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
