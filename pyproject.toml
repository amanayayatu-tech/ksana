[project]
name = "agent-trading-system"
version = "0.1.0"
description = "Methodology-driven local agent trading system scaffold."
requires-python = ">=3.11"
dependencies = [
    "apscheduler",
    "click",
    "jinja2",
    "openai",
    "pydantic>=2",
    "python-dotenv",
    "PyYAML",
]

[project.scripts]
chairman = "chairman.cli:main"
red-team = "red_team.cli:main"
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chairman"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
