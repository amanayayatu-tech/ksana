[project]
name = "agent-trading-system"
version = "0.1.0"
description = "Methodology-driven local agent trading system scaffold."
requires-python = ">=3.11"
dependencies = [
    "apscheduler",
    "click",
    "jinja2",
    "openai",
    "pydantic>=2",
    "python-dotenv",
    "PyYAML",
]

[project.scripts]
chairman = "chairman.cli:main"
red-team = "red_team.cli:main"
orchestrator = "orchestrator.cli:main"
research-agent = "business_agents.research_agent.cli:main"
trading-f_partner = "business_agents.trading_f_partner.cli:main"
trading-w_partner = "business_agents.trading_w_partner.cli:main"
trading-g_partner = "business_agents.trading_g_partner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chairman", "red_team", "orchestrator", "business_agents"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
webui = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
